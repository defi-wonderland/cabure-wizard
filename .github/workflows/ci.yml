name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @wonderland/cabure-crypto build
      - run: pnpm --filter @wonderland/cabure-crypto test
      # Catches high-severity advisories in the prod install graph (e.g. if
      # the underscore override is removed or snarkjs picks up a new vuln).
      # See packages/crypto/README.md and the project IR report L-2.
      # `pnpm audit` does not support `--filter`, so we invoke the script
      # which runs `pnpm audit` at the workspace root.
      - run: pnpm --filter @wonderland/cabure-crypto run audit

  create-cabure-ceremony:
    needs: [crypto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @wonderland/create-cabure-ceremony build
      - run: pnpm --filter @wonderland/create-cabure-ceremony test

  cli:
    needs: [crypto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @wonderland/cabure-cli build
      - run: pnpm --filter @wonderland/cabure-cli test
